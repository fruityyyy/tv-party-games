plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codenames.tv'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.codenames.tv'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk {
            // Most TVs run 32-bit ARM even on 64-bit chips, so ship both.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                // libnode.so links against the shared C++ runtime, so package it.
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libnode/bin']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so it can be sideloaded without a keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    androidResources {
        // The default pattern drops files starting with "_", which node_modules needs.
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}
